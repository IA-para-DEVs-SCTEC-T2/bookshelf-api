name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────
  # JOB: Backend
  # ─────────────────────────────────────────────
  backend:
    name: Backend – Lint / Test / Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (syntax check + OpenAPI validation)
        run: npm run build -- openapi.yaml

      - name: Upload OpenAPI spec as artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: backend/openapi.yaml

  # ─────────────────────────────────────────────
  # JOB: Frontend
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend – Lint / Test / Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ─────────────────────────────────────────────
  # JOB: Docs
  # ─────────────────────────────────────────────
  docs:
    name: Docs – Validate structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required documentation files
        run: |
          echo "Validating required documentation files..."
          required_files=(
            "README.md"
            "docs/ARCHITECTURE.md"
            "docs/INSTALLATION.md"
            "docs/CLASSROOM_CHALLENGES.md"
            "docs/diagrams/api-flow.md"
            "backend/openapi.yaml"
          )
          missing=0
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "MISSING: $file"
              missing=1
            else
              echo "OK: $file"
            fi
          done
          if [ $missing -ne 0 ]; then
            echo "One or more required documentation files are missing."
            exit 1
          fi
          echo "All documentation files are present."

  # ─────────────────────────────────────────────
  # JOB: Deploy (only after all jobs pass)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [backend, frontend, docs]

    # Only deploy on pushes to main (not on pull requests)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Download OpenAPI spec artifact
        uses: actions/download-artifact@v4
        with:
          name: openapi-spec
          path: backend

      - name: Deploy
        run: |
          echo "All checks passed. Starting deployment..."
          echo "Backend artifact: backend/openapi.yaml"
          echo "Frontend artifact: frontend/dist/"
          # Replace this step with your actual deploy command, e.g.:
          # npx wrangler deploy
          # aws s3 sync frontend/dist s3://your-bucket
          # ssh user@host "..."
          echo "Deployment complete."
