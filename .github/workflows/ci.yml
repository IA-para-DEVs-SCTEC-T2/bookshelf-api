name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verificar openapi.yaml existe
        run: test -f openapi.yaml
      - name: Verificar endpoint /books/{id}/status documentado
        run: grep -q '/books/{id}/status' openapi.yaml

  frontend:
    name: Frontend Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docs:
    name: Documentation Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar arquivos de documentação
        run: |
          test -f README.md
          test -f docs/ARCHITECTURE.md
          test -f docs/INSTALLATION.md
          test -f docs/diagrams/api-flow.md

  deploy:
    name: Simulated Deploy
    runs-on: ubuntu-latest
    needs: [backend, frontend, docs]
    steps:
      - uses: actions/checkout@v4
      - run: echo "Todos os jobs passaram. Deploy pronto."
